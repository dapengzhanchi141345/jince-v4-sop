<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">
<title>{{标题}}</title><style>
@page{size:A4;margin:16mm 14mm}
*{box-sizing:border-box}
body{font-family:"Microsoft YaHei","微软雅黑",sans-serif;color:#1a1a1a;font-size:10.5pt;line-height:1.6;margin:0;background:#fff}
h1{font-size:19pt;color:#8a6210;margin:0 0 2px;letter-spacing:.5px}
.subtitle{font-size:11pt;color:#595959;margin:0 0 14px}.meta{font-size:8.5pt;color:#595959;margin:4px 0 10px}
h2{font-size:13pt;color:#8a6210;margin:20px 0 8px;padding-left:9px;border-left:5px solid #8a6210}
h2 span.badge{background:#8a6210;color:#fff;font-size:8pt;padding:1px 7px;border-radius:9px;margin-left:6px;vertical-align:middle}
h3{font-size:11pt;margin:14px 0 6px}.concl{background:#F5EBD0;border:1px solid #e6d4a8;border-radius:4px;padding:10px 13px;margin:8px 0;font-size:10pt}
.kpi{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.card{flex:1 1 140px;min-width:130px;background:#F5EBD0;border-top:4px solid #8a6210;border-radius:4px;padding:9px 11px;page-break-inside:avoid}
.card .n{font-size:17pt;font-weight:bold;color:#8a6210}.card .l{font-size:8.5pt;color:#595959;margin-top:2px}
.card.pos{background:#DCEFE4;border-top-color:#1f6b4a}.card.pos .n{color:#1f6b4a}
.card.neg{background:#F3DEDA;border-top-color:#9e2a20}.card.neg .n{color:#9e2a20}
table{width:100%;border-collapse:collapse;margin:8px 0;font-size:9pt}
th{background:#D8B45A;color:#fff;font-weight:bold;text-align:left;padding:5px 7px}
td{padding:4.5px 7px;border-bottom:1px solid #e6dcc0}.num{text-align:right}
tr:nth-child(even) td{background:#FBF8F0}
.callout{background:#F3DEDA;border-left:4px solid #9e2a20;padding:8px 12px;margin:8px 0;border-radius:3px;font-size:9.5pt;page-break-inside:avoid}
.callout.good{background:#DCEFE4;border-left-color:#1f6b4a}
.chart{margin:8px 0;page-break-inside:avoid}.chart svg{width:100%;height:auto}
ul{margin:6px 0;padding-left:20px}li{margin:3px 0;font-size:9.5pt}
.footer{margin-top:18px;padding-top:8px;border-top:2px solid #D8B45A;font-size:8pt;color:#595959}
</style></head><body>
<h1>{{标题}}</h1>
<div class="subtitle">{{副题}}</div>
<div class="meta">{{元信息}}</div>
<div class="concl">{{大白话结论}}</div>
<h2>一、关键指标<span class="badge">KPI</span></h2>
<div class="kpi">
<div class="card pos"><div class="n">{{值}}</div><div class="l">{{说明}}</div></div>
<div class="card neg"><div class="n">{{值}}</div><div class="l">{{说明}}</div></div>
</div>
<table><tr><th>指标</th><th class="num">报告</th><th class="num">复核</th><th>说明</th></tr>
<tr><td>{{..}}</td><td class="num">{{..}}</td><td class="num">{{..}}</td><td>{{..}}</td></tr></table>
<h2>二、图表</h2>
<div class="chart">{{在此内联 SVG: &lt;svg viewBox="0 0 800 320" ...&gt;...&lt;/svg&gt;}}</div>
<div class="callout good"><b>亮点：</b>{{..}}</div>
<div class="callout"><b>风险：</b>{{..}}</div>
<h2>三、逐日/逐笔明细</h2>
<table><tr><th>交易日</th><th class="num">笔数</th><th class="num">净盈亏</th></tr>
<tr><td>{{..}}</td><td class="num">{{..}}</td><td class="num">{{..}}</td></tr></table>
<h2>四、可执行建议</h2>
<ul><li>{{..}}</li></ul>
<div class="footer">{{脚注}}</div>
</body></html>
